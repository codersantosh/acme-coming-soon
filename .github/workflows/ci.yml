name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acme-coming-soon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_VERSION: '1.0.7'
  PLUGIN_SLUG: acme-coming-soon

jobs:
  syntax:
    name: PHP, Python, and Shell Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint PHP source and CI scripts
        run: |
          set -euo pipefail
          find . -type f -name '*.php' \
            -not -path './node_modules/*' \
            -not -path './vendor/*' \
            -not -path './deploy/*' \
            -print0 | xargs -0 -r -n1 php -l > /dev/null
      - name: Compile Python release tools
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pycache"
          python3 -m py_compile \
            .github/scripts/verify-artifact.py \
            .github/scripts/artifact-manifest.py
      - name: Parse shell release tools
        run: |
          set -euo pipefail
          bash -n .github/scripts/install-wp-cli.sh
          bash -n .github/scripts/wordpress-runtime-smoke.sh
          bash -n .github/scripts/svn-release.sh

  composer:
    name: Composer, PHPUnit, and Coding Standards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli, curl, xml, mbstring, zip, intl
          tools: composer:v2
      - name: Validate Composer metadata and lock
        run: composer validate --strict --no-check-publish
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Audit locked PHP dependencies
        run: composer audit --locked --no-interaction --format=plain
      - name: Run PHPUnit
        run: vendor/bin/phpunit
      - name: Run PHPCS
        run: vendor/bin/phpcs --report=summary
      - name: Run PHPCompatibility for PHP 8.3+
        run: |
          set -euo pipefail
          mapfile -t php_paths < <(
            find acme-coming-soon.php admin includes public \
              \( -path '*/vendor/*' -o -path '*/node_modules/*' \) -prune -o \
              -type f -name '*.php' -print
          )
          if [[ -f uninstall.php ]]; then
            php_paths+=(uninstall.php)
          fi
          vendor/bin/phpcs \
            --standard=PHPCompatibilityWP \
            --runtime-set testVersion 8.3- \
            --report=summary \
            "${php_paths[@]}"

  package:
    name: Build and Validate Release Package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      package_sha256: ${{ steps.digest.outputs.package_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: curl, xml, mbstring, zip
      - name: Install pinned WP-CLI
        run: bash .github/scripts/install-wp-cli.sh
      - name: Verify Node and package version
        run: |
          set -euo pipefail
          node -e "const [major, minor, patch] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && (minor < 22 || (minor === 22 && patch < 2)))) process.exit(1)"
          node -e "const p = require('./package.json'); if (p.name !== 'acme-coming-soon' || p.version !== process.env.EXPECTED_VERSION) throw new Error('package.json must identify acme-coming-soon ' + process.env.EXPECTED_VERSION)"
      - name: Install locked npm dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit npm dependencies
        run: |
          set -euo pipefail
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
      - name: Run JavaScript and SCSS lint scripts when present
        run: |
          set -euo pipefail
          for script in lint lint:js lint:scss lint:sass lint:css; do
            if node -e "process.exit(require('./package.json').scripts?.[process.argv[1]] ? 0 : 1)" "$script"; then
              echo "Running npm run $script"
              npm run "$script"
            else
              echo "No $script script; skipping."
            fi
          done
      - name: Clean build
        run: |
          set -euo pipefail
          rm -rf build deploy
          npm run build
      - name: Run full deploy twice and compare ZIPs
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          archive="deploy/acme-coming-soon-${version}.zip"
          [[ "$version" == "$EXPECTED_VERSION" ]]
          npm run deploy
          [[ -f "$archive" ]]
          cp "$archive" "${RUNNER_TEMP}/acme-coming-soon-first.zip"
          npm run deploy
          cmp "${RUNNER_TEMP}/acme-coming-soon-first.zip" "$archive"
      - name: Validate package contents
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          python3 .github/scripts/verify-artifact.py "$version" deploy
          php .github/scripts/validate-release.php "$version" deploy/acme-coming-soon
          find deploy/acme-coming-soon -type f -name '*.php' -print0 \
            | xargs -0 -r -n1 php -l > /dev/null
          unzip -tqq "deploy/acme-coming-soon-${version}.zip"
      - name: Record release ZIP digest
        id: digest
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          digest="$(sha256sum "deploy/acme-coming-soon-${version}.zip" | cut -d ' ' -f 1)"
          echo "package_sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Run official WordPress Plugin Check 1.1.9
        uses: wordpress/plugin-check-action@v1.1.9
        with:
          build-dir: deploy/acme-coming-soon
          wp-version: '7.1.5'
          slug: acme-coming-soon
          ignore-errors: 'false'
          ignore-warnings: 'false'
          # Bundled ATRC 1.0.37 uses React APIs removed in React 19; upstream,
          # tracked in docs/wordpress-org-deployment.md.
          ignore-codes: 'react_removed_api'
      - name: Upload CI package
        uses: actions/upload-artifact@v7
        with:
          name: ci-acme-coming-soon-${{ env.EXPECTED_VERSION }}-${{ github.sha }}
          path: |
            deploy/acme-coming-soon/
            deploy/acme-coming-soon-${{ env.EXPECTED_VERSION }}.zip
            deploy/acme-coming-soon-${{ env.EXPECTED_VERSION }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  runtime:
    name: WordPress Runtime Matrix
    needs: package
    uses: ./.github/workflows/runtime.yml
    with:
      ref: ${{ github.sha }}
      package_sha256: ${{ needs.package.outputs.package_sha256 }}
